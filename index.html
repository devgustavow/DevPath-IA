<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/terminal.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevPath AI — O Arquiteto de Carreira para Devs</title>

    <!-- Fontes: Inter (leitura) + JetBrains Mono (dados técnicos / IDE) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind via Play CDN (sem build) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Configuração do tema: fontes, cores de destaque e animações customizadas.
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
              mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
            },
            animation: {
              'fade-in': 'fadeIn 0.5s ease-out forwards',
              'fade-in-up': 'fadeInUp 0.5s ease-out forwards',
              'blink': 'blink 1s step-end infinite',
              'glow': 'glow 2.5s ease-in-out infinite',
              'spin-slow': 'spin 3s linear infinite',
              'slide-in': 'slideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            },
            keyframes: {
              fadeIn: { '0%': { opacity: 0 }, '100%': { opacity: 1 } },
              fadeInUp: {
                '0%': { opacity: 0, transform: 'translateY(12px)' },
                '100%': { opacity: 1, transform: 'translateY(0)' },
              },
              blink: { '0%, 100%': { opacity: 1 }, '50%': { opacity: 0 } },
              glow: {
                '0%, 100%': { boxShadow: '0 0 22px -6px rgba(16,185,129,0.45)' },
                '50%': { boxShadow: '0 0 34px -2px rgba(16,185,129,0.75)' },
              },
              slideIn: {
                '0%': { opacity: 0, transform: 'translateX(40px)' },
                '100%': { opacity: 1, transform: 'translateX(0)' },
              },
            },
          },
        },
      }
    </script>

    <style>
      /* Grid sutil de fundo estilo IDE/blueprint */
      body {
        background-color: #020617; /* slate-950 */
        background-image:
          radial-gradient(circle at 15% 0%, rgba(16, 185, 129, 0.08), transparent 40%),
          radial-gradient(circle at 85% 10%, rgba(139, 92, 246, 0.08), transparent 40%),
          linear-gradient(rgba(148, 163, 184, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(148, 163, 184, 0.035) 1px, transparent 1px);
        background-size: 100% 100%, 100% 100%, 38px 38px, 38px 38px;
      }

      /* Scrollbar com a pegada do tema dark */
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track { background: #020617; }
      ::-webkit-scrollbar-thumb {
        background: #1e293b;
        border-radius: 6px;
        border: 2px solid #020617;
      }
      ::-webkit-scrollbar-thumb:hover { background: #334155; }

      /* Texto com gradiente reaproveitável */
      .text-gradient {
        background: linear-gradient(120deg, #34d399 0%, #2dd4bf 45%, #818cf8 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
